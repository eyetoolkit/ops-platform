# Profile: eyetoolkit-drugs
# VitePress sub-site served as a sub-path of eyetoolkit.com (nginx alias).
# Source lives inside the eyetoolkit/blog monorepo (sites/drugs).

site: eyetoolkit-drugs
domain: eyetoolkit.com/drugs/
type: monorepo-vitepress

repo: eyetoolkit/blog
default_ref: master
source_repo_dir: .

build_cmd: 'cd sites/drugs && npm ci && npm run build'
artifact: sites/drugs/docs/.vitepress/dist

deploy_target:
  host: 101.96.194.237
  remote_dir: /home/blog-deploy/eyetoolkit-drugs
  nginx_reload: true

health_check_url: https://eyetoolkit.com/drugs/

secrets_required:
  - DEPLOY_SSH_KEY
  - DEPLOY_HOST

notes: |
  Part of the eyetoolkit/blog monorepo. Deploys to its own nginx alias dir so the
  main-site cron (rsync --delete on /home/blog-deploy/eyetoolkit) never wipes it.
