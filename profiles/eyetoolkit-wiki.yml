# Profile: eyetoolkit-wiki
# VitePress sub-site served as a sub-path of eyetoolkit.com (nginx alias).
# Source lives inside the eyetoolkit/blog monorepo (sites/wiki).

site: eyetoolkit-wiki
domain: eyetoolkit.com/wiki/
type: monorepo-vitepress

repo: eyetoolkit/blog
default_ref: master
source_repo_dir: .

build_cmd: 'cd sites/wiki && npm ci && npm run build'
artifact: sites/wiki/docs/.vitepress/dist

deploy_target:
  host: 101.96.194.237
  remote_dir: /home/blog-deploy/eyetoolkit-wiki
  nginx_reload: true

health_check_url: https://eyetoolkit.com/wiki/

secrets_required:
  - DEPLOY_SSH_KEY
  - DEPLOY_HOST

notes: |
  Part of the eyetoolkit/blog monorepo. Deploys to its own nginx alias dir so the
  main-site cron (rsync --delete on /home/blog-deploy/eyetoolkit) never wipes it.
