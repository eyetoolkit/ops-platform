name: Deploy Site (Manual Trigger)

# Manual trigger wrapper — workflow_call cannot also be workflow_dispatch.
# This thin wrapper calls the reusable workflow.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile name (without .yml)"
        required: true
        default: "eyetoolkit-blog"
      ref:
        description: "Git ref of target repo"
        required: false
        default: "main"

jobs:
  call-deploy:
    uses: eyetoolkit/ops-platform/.github/workflows/deploy-site.yml@main
    with:
      profile: ${{ inputs.profile }}
      ref: ${{ inputs.ref }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_NOTIFY_WEBHOOK: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}