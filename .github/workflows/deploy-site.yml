name: Deploy Site (Reusable)

# Called by other repos' deploy.yml (reusable workflow pattern).
# All inputs are strings. The actual deploy logic runs on the SSH target.

on:
  workflow_call:
    inputs:
      profile:
        description: "Profile name (without .yml) — must exist in ops-platform/profiles/"
        type: string
        default: "eyetoolkit-blog"
      ref:
        description: "Git ref (branch/tag) of target repo. Empty defaults to main."
        type: string
        default: "main"
    secrets:
      DEPLOY_SSH_KEY:
        description: "SSH private key for deploy user"
      DEPLOY_HOST:
        description: "Target host (IP or hostname)"
      DEPLOY_USER:
        description: "Target SSH username"
      DEPLOY_NOTIFY_WEBHOOK:
        description: "Optional webhook URL for failure alerts"

jobs:
  deploy:
    name: Deploy ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout ops-platform repo (for scripts + profile YAML)
        uses: actions/checkout@v4
        with:
          repository: eyetoolkit/ops-platform
          path: ops
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate profile + push scripts via SCP
        run: |
          set -e
          if [ ! -f "ops/profiles/${{ inputs.profile }}.yml" ]; then
            echo "::error::Profile file not found: ops/profiles/${{ inputs.profile }}.yml"
            exit 1
          fi
          echo "✓ Profile found"
          # Decode SSH key and use sshpass-like trick via ssh-add is not possible.
          # Instead, embed the deploy script via a single SSH command using inline heredoc.
          echo "scripts ready"

      - name: Build & deploy via SSH (single session)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          command_timeout: 30m   # 大型 VitePress 构建（267M monorepo）可能超过默认 10m
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            PROFILE="${{ inputs.profile }}"
            REF="${{ inputs.ref }}"
            OPS_DIR=/opt/ops-platform

            # 用 git 拉取 ops-platform（避免 raw.githubusercontent CDN 缓存导致拿到陈旧/CRLF 文件）
            if [ -d "$OPS_DIR/.git" ]; then
              git -C "$OPS_DIR" fetch --depth=1 origin main
              git -C "$OPS_DIR" checkout -f FETCH_HEAD
            else
              rm -rf "$OPS_DIR"
              git clone --depth=1 https://github.com/eyetoolkit/ops-platform.git "$OPS_DIR"
            fi
            chmod +x "$OPS_DIR/scripts/deploy-static.sh"
            echo "✓ fetched profile + scripts (via git)"

            # Pass profile content via stdin to deploy-static.sh via a tmp env file
            bash "$OPS_DIR/scripts/deploy-static.sh" "$PROFILE" "$REF" "$OPS_DIR"

      - name: Health check
        if: success()
        run: |
          URL=$(python3 -c "
          import yaml
          print(yaml.safe_load(open('ops/profiles/${{ inputs.profile }}.yml'))['health_check_url'])
          ")
          echo "Health checking: $URL"
          sleep 8
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "$URL")
            echo "  attempt $i: HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ]; then
              echo "✓ Healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check failed"
          exit 1

      - name: Notify failure
        if: failure()
        run: |
          if [ -n "${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}" ]; then
            MSG="❌ Deploy failed: profile=${{ inputs.profile }} ref=${{ inputs.ref }} host=${{ secrets.DEPLOY_HOST }} runUrl=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            curl -sk -X POST "${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d "{\"msgtype\":\"text\",\"content\":{\"text\":\"${MSG}\"}}"
          fi